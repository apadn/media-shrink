# 复制到 .github/workflows/ci.yml 即启用 GitHub Actions。
# 之所以没直接放在那个路径：推 .github/workflows/ 下的文件要求 token 带 workflow 权限，
# 只有 repo 权限的 PAT 会被 GitHub 整单拒绝。用网页 New file 贴进去最省事。
name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Python 语法检查
        run: python -m compileall -q app && echo "app/ 编译通过"

      - name: 前端语法检查
        run: node --check app/static/app.js && echo "app.js 语法通过"

      - name: Shell 脚本语法检查
        run: |
          for f in test/e2e.sh; do
            bash -n "$f" && echo "OK  $f"
          done

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 构建镜像
        run: docker build --tag media-shrink:ci .

      - name: 起容器做健康检查
        run: |
          mkdir -p .ci/media
          docker run -d --name ms-ci -p 8000:8000 \
            -v "$PWD/.ci/media:/media" \
            -e MEDIA_ROOTS=/media \
            media-shrink:ci

          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:8000/api/health; then
              echo; echo "健康检查通过"
              exit 0
            fi
            sleep 2
          done

          echo "健康检查失败，容器日志："
          docker logs ms-ci
          exit 1

      - name: 检查编码器是否齐全
        run: |
          docker exec ms-ci ffmpeg -hide_banner -encoders 2>/dev/null \
            | grep -E "libsvtav1|libx265|libx264|hevc_qsv|hevc_nvenc|hevc_vaapi" \
            | sort -u

      - name: 清理
        if: always()
        run: docker rm -f ms-ci || true
